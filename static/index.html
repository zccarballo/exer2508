<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- FORMULARIO PARA LOGUEO -->
    <h2>LOG IN USUARIOS</h2>
    <form id="formulario">
        <input type="text" name="nome" placeholder="Nome">
        <input type="text" name="email" placeholder="Email">
        <button id="botonEnviar">Enviar</button>
    </form>
    <div id="mensagem"></div> 
    
    
    <script>
    // FORMULARIO PARA LOGUEO
        botonEnviar.addEventListener("click",async (e)=>{
            e.preventDefault();
            //const {nome, email} = formulario;// desesctructura o obxeto de entrada
            //console.log(nome.value, email.value);// imprime os valores do formulario

            let datosFormulario = new FormData(formulario);
            let entradas = Object.fromEntries(datosFormulario.entries());
            
            console.log(JSON.stringify(entradas))
            
            let obxetoEnvio = {
                method: "POST",
                headers:{
                    "Content-type":"application/json"
                },
                body: JSON.stringify(entradas)
            }
            let respostaServer = await fetch("/acceso", obxetoEnvio) 

            let resposta = await respostaServer.json();
            console.log(resposta);
            

            if(resposta.resposta == "acceso autorizado"){
                console.log("iremos a app")
                
                localStorage.setItem("token",resposta.tokenUsuario)
                location.replace("/app");
            }else{
                console.log(resposta.resposta);
                mensagem.innerHTML = resposta.resposta;
            }
        })
    // FORMULARIO PARA REXISTRARSE E PODER TER TAREFAS ASIGNADAS
        formRexistro.addEventListener("submit", async (e) => {
             e.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const contrasinal = document.getElementById('contrasinal').value;

            try {
                const resposta = await fetch('http://localhost:3000/usuarios', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ nome, email, contrasinal })
                });

                const datos = await resposta.json();

                if (resposta.ok) {
                document.getElementById('rexistroResultado').innerText = 'Usuario creado correctamente!';
                } else {
                document.getElementById('rexistroResultado').innerText = 'Erro: ' + datos.mensaxe;
                }
            } catch (erro) {
                console.error(erro);
                document.getElementById('rexistroResultado').innerText = 'Erro ao conectar co servidor.';
            }
            });

            const form = document.getElementById("formNovaTarefa");
    const input = document.getElementById("novaTarefa");
    const container = document.getElementById("tarefasContainer");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        // Crear tarefa
        const tarefaTexto = input.value;
        const tarefaDiv = document.createElement("div");
        tarefaDiv.classList.add("tarefa");

        const span = document.createElement("span");
        span.textContent = tarefaTexto;

        // Botóns
        const btnEnviado = document.createElement("button");
        btnEnviado.textContent = "Enviado";
        btnEnviado.addEventListener("click", () => {
            span.style.textDecoration = "line-through";
            span.style.color = "green";
        });

        const btnEditar = document.createElement("button");
        btnEditar.textContent = "Editar";
        btnEditar.addEventListener("click", () => {
            const novoTexto = prompt("Editar tarefa:", span.textContent);
            if (novoTexto !== null && novoTexto.trim() !== "") {
                span.textContent = novoTexto;
            }
        });

        const btnBorrar = document.createElement("button");
        btnBorrar.textContent = "Borrar";
        btnBorrar.addEventListener("click", () => {
            tarefaDiv.remove();
        });

        // Engadir elementos
        tarefaDiv.appendChild(span);
        tarefaDiv.appendChild(btnEnviado);
        tarefaDiv.appendChild(btnEditar);
        tarefaDiv.appendChild(btnBorrar);
        container.appendChild(tarefaDiv);

        input.value = "";
    });
    </script>
</body>
</html>
